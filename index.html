<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocPro Scanner V2</title>
  
  <!-- Required for PDF Generation -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .hidden { display: none !important; }
    .field-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input, select, button { padding: 8px 12px; font-size: 14px; width: 100%; max-width: 320px; box-sizing: border-box; }
    button { cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; margin-top: 8px; }
    button:hover { background-color: #0056b3; }
    .btn-delete { background-color: #dc3545; width: auto; margin-top: 4px; }
    .gallery-card { display: inline-block; margin: 8px; text-align: center; border: 1px solid #ccc; padding: 6px; }
    .gallery-card img { width: 120px; height: 160px; object-fit: cover; display: block; }
    #cameraStream { width: 100%; max-width: 480px; background-color: #000; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN CONTAINER -->
  <div id="loginScreen">
    <h2>DocPro Scanner V2 - Login</h2>
    
    <div class="field-group">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username" />
    </div>

    <div class="field-group">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="Enter password" />
    </div>

    <div class="field-group">
      <label for="companySelect">Select Company</label>
      <select id="companySelect">
        <option value="company_a">Company A</option>
        <option value="company_b">Company B</option>
        <option value="company_c">Company C</option>
      </select>
    </div>

    <button type="button" id="loginBtn">Login</button>
    <p id="loginError"></p>
  </div>

  <!-- 2. MAIN APPLICATION CONTAINER -->
  <div id="appContainer" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 480px;">
      <h2>Document Scanner</h2>
      <button type="button" id="logoutBtn" style="width: auto; background-color: #6c757d;">Logout</button>
    </div>

    <video id="cameraStream" autoplay playsinline></video>
    
    <button type="button" id="captureBtn">Capture Page</button>
    
    <div style="margin-top: 15px;">
      <label for="documentName">Document Name</label>
      <input type="text" id="documentName" placeholder="e.g., Invoice_001" />
      <button type="button" id="uploadBtn">Upload PDF</button>
      <p id="uploadStatus"></p>
    </div>

    <h3>Scanned Pages (<span id="pageCount">0</span>)</h3>
    <div id="imageGallery"></div>
  </div>

  <!-- Load Main Script -->
  <script src="app.js"></script>
</body>
</html>
