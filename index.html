<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocPro Scanner V2</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

<!-- ===========================
     LOGIN SCREEN
=========================== -->
<div id="loginScreen" class="container-fluid vh-100 d-flex justify-content-center align-items-center">
    <div class="login-card shadow-lg p-4 rounded bg-white">
        
        <div class="text-center mb-4">
            <div class="logo-icon display-4 text-primary">
                <i class="bi bi-file-earmark-text-fill"></i>
            </div>
            <h1 class="logo-title h3 fw-bold">DocPro</h1>
            <div class="logo-subtitle text-muted">Smart Document Scanner</div>
            <div class="logo-by text-muted small">by RNTL</div>
        </div>

        <div class="mb-3">
            <label for="companySelect" class="form-label fw-bold">Select Company</label>
            <select id="companySelect" class="form-select">
                <option value="company_a">Otaku House</option>
                <option value="company_b">Company B</option>
                <option value="company_c">Company C</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="usernameInput" class="form-label">Username</label>
            <input id="usernameInput" type="text" class="form-control" placeholder="Enter Username">
        </div>

        <div class="mb-3">
            <label for="passwordInput" class="form-label">Password</label>
            <input id="passwordInput" type="password" class="form-control" placeholder="Enter Password">
        </div>

        <button id="loginBtn" type="button" class="btn btn-primary w-100 mb-2">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>

        <!-- Display error message -->
        <div id="loginError" class="text-center fw-bold mt-2" style="min-height: 24px;"></div>

    </div>
</div>

<!-- ===========================
     MAIN APP / HOME SCREEN
=========================== -->
<div id="appContainer" style="display:none;">

    <div id="homeScreen">
        <!-- Top Navbar -->
        <div class="top-nav">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-file-earmark-text-fill fs-4 text-primary"></i>
                    <span class="fw-bold fs-5">DocPro</span>
                </div>
                <div>
                    <button id="logoutBtn" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="welcome-box mb-4">
                <h2 class="h4 fw-bold">Document Scanner</h2>
                <p class="text-muted mb-0">Capture, manage, and export your documents</p>
            </div>

            <!-- Dashboard Grid -->
            <div class="row g-3">
                <div class="col-6">
                    <div class="dash-card bg-primary text-white p-3 rounded-4 shadow-sm text-center position-relative">
                        <i class="bi bi-camera-fill display-5 mb-2"></i>
                        <h3 class="h6 mb-0">Scan New</h3>
                        <a href="#" id="openScannerBtn" class="stretched-link"></a>
                    </div>
                </div>
                <div class="col-6">
                    <div class="dash-card bg-white p-3 rounded-4 shadow-sm text-center position-relative">
                        <i class="bi bi-folder-fill display-5 text-warning mb-2"></i>
                        <h3 class="h6 mb-0">Documents</h3>
                        <span id="docBadge" class="badge bg-secondary rounded-pill position-absolute top-0 end-0 m-2">0</span>
                        <a href="#" id="openDocsBtn" class="stretched-link"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===========================
         SCANNER SCREEN
    =========================== -->
    <div id="scannerScreen" class="d-none">
        <div class="top-nav">
            <div class="d-flex justify-content-between align-items-center">
                <button id="closeScannerBtn" class="btn btn-link text-dark p-0">
                    <i class="bi bi-x-lg fs-4"></i>
                </button>
                <span class="fw-bold">Scan Document</span>
                <button id="flashToggleBtn" class="btn btn-link text-dark p-0">
                    <i class="bi bi-lightning-fill fs-5"></i>
                </button>
            </div>
        </div>

        <div class="camera-container">
            <video id="cameraStream" autoplay playsinline muted></video>
            <div class="scanner-guide"></div>
        </div>

        <div class="scanner-controls">
            <div class="d-flex justify-content-around align-items-center w-100">
                <div id="galleryPreviewBtn" class="preview-thumb rounded">
                    <span id="capturedCount" class="badge bg-danger">0</span>
                </div>
                <button id="captureBtn" class="btn btn-light rounded-circle p-3 shadow">
                    <div class="capture-inner rounded-circle"></div>
                </button>
                <button id="finishScanBtn" class="btn btn-success rounded-circle">
                    <i class="bi bi-check-lg fs-4"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ===========================
         REVIEW / UPLOAD SCREEN
    =========================== -->
    <div id="reviewScreen" class="d-none">
        <div class="top-nav">
            <div class="d-flex justify-content-between align-items-center">
                <button id="backToScannerBtn" class="btn btn-link text-dark p-0">
                    <i class="bi bi-arrow-left fs-4"></i>
                </button>
                <span class="fw-bold">Review Pages (<span id="pageCount">0</span>)</span>
                <button id="saveDocBtn" class="btn btn-primary btn-sm fw-bold">Save</button>
            </div>
        </div>

        <div class="main-content">
            <div class="mb-3">
                <label for="documentName" class="form-label fw-bold">Document Name</label>
                <input id="documentName" type="text" class="form-control" placeholder="e.g., Invoice_001">
            </div>

            <button id="uploadBtn" class="btn btn-success w-100 mb-3">
                <i class="bi bi-cloud-arrow-up-fill"></i> Upload PDF
            </button>
            
            <div id="uploadStatus" class="mt-2 text-center fw-bold"></div>

            <div id="imageGallery" class="row g-2 mt-2"></div>
        </div>
    </div>

</div>

<!-- JavaScript Libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<!-- App Logic -->
<script src="app.js"></script>

</div>
</body>
</html>
